<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir Telegram</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px;">
  <h1>Abriendo en Bgram / Telegram...</h1>
  <p>Redirigiendo al reproductor...</p>

  <p>
    <a id="openBtn" href="#" style="display:inline-block;padding:12px 18px;background:#0a7cff;color:white;text-decoration:none;border-radius:8px;">
      Forzar apertura
    </a>
  </p>

  <p id="info" style="color:#555;"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    let chat = params.get("chat");
    const msg = params.get("msg");
    const thread = params.get("thread");

    const btn = document.getElementById("openBtn");
    const info = document.getElementById("info");

    if (!chat || !msg) {
      info.textContent = "Faltan parámetros en la URL.";
    } else {
      // 1. Limpiamos el prefijo -100 si lo tuviera. 
      // El comando openmessage usa el ID base (ej. 3836216417)
      let baseChatId = chat;
      if (baseChatId.startsWith("-100")) {
        baseChatId = baseChatId.substring(4);
      }

      // 2. Construimos el comando de bajo nivel tg://openmessage
      // Formato: tg://openmessage?chat_id=CHATID&message_id=MESSAGEID
      const tgOpenMessage = `tg://openmessage?chat_id=${baseChatId}&message_id=${msg}`;

      // 3. Lo metemos en un Intent de Android para el esquema tg
      const intentUrl = `intent://${tgOpenMessage.replace('tg://', '')}#Intent;scheme=tg;end;`;

      btn.href = intentUrl;
      info.innerHTML = `Chat: ${baseChatId} <br>Msg: ${msg} <br><br>Intentando comando interno de BD...`;
      
      // Disparamos el intent principal
      setTimeout(() => {
        window.location.href = intentUrl;
        
        // Fallback: Si el intent falla, intentamos una URI normal de Android para Bgram
        setTimeout(() => {
          window.location.href = tgOpenMessage;
        }, 1500);
      }, 500);
    }
  </script>
</body>
</html>
