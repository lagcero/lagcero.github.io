<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir Telegram</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px;">
  <h1>Abrir mensaje de Telegram</h1>
  <p>Redirigiendo a tu aplicación de Telegram...</p>

  <p>
    <a id="openBtn" href="#" style="display:inline-block;padding:12px 18px;background:#0a7cff;color:white;text-decoration:none;border-radius:8px;">
      Abrir en la App
    </a>
  </p>

  <p id="info" style="color:#555;"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    let chat = params.get("chat");
    const msg = params.get("msg");
    const thread = params.get("thread");

    const btn = document.getElementById("openBtn");
    const info = document.getElementById("info");

    if (!chat || !msg) {
      info.textContent = "Faltan parámetros en la URL.";
    } else {
      // 1. Limpiamos el chatID para que no tenga el -100
      // Los enlaces t.me/c/ NUNCA llevan el -100
      if (chat.startsWith("-100")) {
        chat = chat.substring(4);
      }

      // 2. Construimos el enlace web oficial
      const tMeUrl = thread 
        ? `https://t.me/c/${chat}/${thread}/${msg}`
        : `https://t.me/c/${chat}/${msg}`;

      // 3. Intent universal de Android para atrapar URLs https://t.me
      // Al no poner 'package', Android preguntará con qué app quieres abrir este enlace (Bgram, Plus, etc)
      const intentUrl = `intent://${tMeUrl.replace('https://', '')}#Intent;scheme=https;end;`;

      btn.href = intentUrl;
      info.innerHTML = `Intentando abrir con cliente alternativo...`;
      
      // Intentamos abrirlo automáticamente
      setTimeout(() => {
        window.location.href = intentUrl;
      }, 500);
    }
  </script>
</body>
</html>
