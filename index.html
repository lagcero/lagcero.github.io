<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir Telegram</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px;">
  <h1>Abrir mensaje de Telegram</h1>
  <p>Redirigiendo a la app de Telegram...</p>

  <p>
    <a id="openBtn" href="#" style="display:inline-block;padding:12px 18px;background:#0a7cff;color:white;text-decoration:none;border-radius:8px;">
      Abrir en Telegram
    </a>
  </p>

  <p id="info" style="color:#555;"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    let chat = params.get("chat");
    const msg = params.get("msg");
    const thread = params.get("thread");

    const btn = document.getElementById("openBtn");
    const info = document.getElementById("info");

    if (!chat || !msg) {
      info.textContent = "Faltan parámetros en la URL. Debe llevar ?chat=...&msg=...";
    } else {
      // Nos aseguramos de quitar cualquier prefijo -100 si lo tuviera, 
      // porque los enlaces t.me/c/ usan el ID sin el -100
      if (chat.startsWith("-100")) {
        chat = chat.substring(4);
      }

      // Construimos el enlace estándar de mensaje privado en Telegram
      // Formato: https://t.me/c/ChatID/TopicID/MessageID
      const tMeUrl = thread 
        ? `https://t.me/c/${chat}/${thread}/${msg}`
        : `https://t.me/c/${chat}/${msg}`;

      // En Android, podemos forzar que se abra en la app usando un intent
      // fallbackUrl hará que si falla, intente abrir en el navegador
      const intentUrl = `intent://${tMeUrl.replace('https://', '')}#Intent;package=org.telegram.messenger;scheme=https;end;`;

      btn.href = intentUrl;
      info.innerHTML = `Chat: ${chat} <br>Mensaje: ${msg} <br>Hilo: ${thread || 'Ninguno'}`;
      
      // Auto-redirección
      setTimeout(() => {
        window.location.href = intentUrl;
      }, 500);
    }
  </script>
</body>
</html>
