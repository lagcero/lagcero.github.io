<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir Telegram</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px;">
  <h1>Abrir mensaje de Telegram</h1>
  <p>Redirigiendo a tu aplicación de Telegram...</p>

  <p>
    <a id="openBtn" href="#" style="display:inline-block;padding:12px 18px;background:#0a7cff;color:white;text-decoration:none;border-radius:8px;">
      Abrir en la App
    </a>
  </p>

  <p id="info" style="color:#555;"></p>

  <script>
    const params = new URLSearchParams(window.location.search);
    let chat = params.get("chat");
    const msg = params.get("msg");
    const thread = params.get("thread");

    const btn = document.getElementById("openBtn");
    const info = document.getElementById("info");

    if (!chat || !msg) {
      info.textContent = "Faltan parámetros en la URL.";
    } else {
      // 1. Limpiamos el chatID para que no tenga el -100
      if (chat.startsWith("-100")) {
        chat = chat.substring(4);
      }

      // 2. Construimos el enlace universal (URI universal de Telegram)
      // tg://resolve?domain=c&post=MensajeID&channel=ChatID&thread=ThreadID
      // Este formato lo pillan TODOS los clientes (oficiales y no oficiales)
      let tgUrl = `tg://privatepost?channel=${chat}&post=${msg}`;
      if (thread) {
        tgUrl += `&thread=${thread}`;
      }

      // 3. Lo convertimos en un Intent de Android GENÉRICO (sin forzar org.telegram.messenger)
      // Esto hace que salte el selector de apps de Android si tienes varias, o abra la única que tengas (Bgram/Plus)
      const intentUrl = `intent://${tgUrl.replace('tg://', '')}#Intent;scheme=tg;end;`;

      btn.href = intentUrl;
      info.innerHTML = `Intentando abrir con cliente alternativo...`;
      
      // Intentamos abrirlo automáticamente
      setTimeout(() => {
        window.location.href = intentUrl;
        
        // Fallback por si el intent falla (a los 2 segundos prueba con el tg:// directo)
        setTimeout(() => {
            window.location.href = tgUrl;
        }, 2000);
      }, 500);
    }
  </script>
</body>
</html>
